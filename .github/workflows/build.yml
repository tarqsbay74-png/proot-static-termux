name: Build proot static (aarch64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # 1. تثبيت Android NDK
      # ----------------------------------------------
      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q android-ndk-r23c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r23c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # ----------------------------------------------
      # 2. تحميل libtalloc (ثابتة + headers)
      # ----------------------------------------------
      - name: Download libtalloc static and headers
        run: |
          mkdir -p libs include
          curl -L -o libs/libtalloc.a https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc-static/libtalloc-static_2.4.3_aarch64.deb
          ar x libs/libtalloc.a --output=libs/
          curl -L -o libs/libtalloc-dev.deb https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_aarch64.deb
          ar x libs/libtalloc-dev.deb --output=libs/
          tar -xf libs/data.tar.xz -C libs/
          cp libs/data/data/com.termux/files/usr/include/talloc.h include/

      # ----------------------------------------------
      # 3. تحميل libandroid-shmem
      # ----------------------------------------------
      - name: Download libandroid-shmem
        run: |
          curl -L -o libs/libandroid-shmem.so https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb
          ar x libs/libandroid-shmem.so --output=libs/ || true

      # ----------------------------------------------
      # 4. استنساخ كود proot
      # ----------------------------------------------
      - name: Clone proot source
        run: git clone https://github.com/termux/proot

      # ----------------------------------------------
      # 5. تعديل الملفات المصدر
      # ----------------------------------------------
      - name: Patch source files
        run: |
          cd proot/src
          # حل مشكلة getifaddrs
          sed -i '1i#define _GNU_SOURCE' syscall/enter.c
          sed -i '2i#include <ifaddrs.h>' syscall/enter.c
          # تعديل GNUmakefile
          sed -i 's|^CFLAGS += -Wall -Wextra -O2|CFLAGS += -Wall -Wextra -O2 -D_GNU_SOURCE -I$PWD/../../include|' GNUmakefile
          sed -i 's|^LDFLAGS += -ltalloc -Wl,-z,noexecstack|LDFLAGS += -static -L$PWD/../../libs -ltalloc -Wl,-z,noexecstack|' GNUmakefile

      # ----------------------------------------------
      # 6. بناء proot مع تحديد أدوات NDK بالكامل
      # ----------------------------------------------
      - name: Build proot
        run: |
          cd proot/src
          # تحديد جميع أدوات NDK
          export CC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          export CXX=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          export AR=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ar
          export LD=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ld
          export STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          export OBJCOPY=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy
          export OBJDUMP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump
          export CFLAGS="-fPIC -O2 -D_GNU_SOURCE -I$PWD/../../include"
          export LDFLAGS="-static -L$PWD/../../libs"
          # بناء
          make PROOT_WITH_LIBANDROID_SHMEM=true

      # ----------------------------------------------
      # 7. التحقق من الملف الناتج
      # ----------------------------------------------
      - name: Verify output
        run: |
          cd proot/src
          file proot
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-readelf -d proot | grep NEEDED || echo "No dynamic dependencies"
          ls -lh proot

      # ----------------------------------------------
      # 8. رفع الملف كـ artifact
      # ----------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-static-aarch64
          path: proot/src/proot